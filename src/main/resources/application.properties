# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/futevolei_dev
spring.datasource.username=postgres
spring.datasource.password=85792426
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações adicionais
spring.sql.init.mode=never
server.port=8080

# Configuração de logging (opcional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações da aplicação
spring.application.name=futevolei-backend

# Configurações de encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# Configurações de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configurações de log (opcional)
logging.level.com.futevoleidolago=DEBUG
logging.level.org.springframework.web=DEBUG