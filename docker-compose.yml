version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: futevolei-postgres
    environment:
      POSTGRES_DB: futevolei_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - futevolei-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: futevolei-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@futevolei.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - futevolei-network

volumes:
  postgres_data:

networks:
  futevolei-network:
    driver: bridge